<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BUGÜNÜM"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><title>BUGÜNÜM</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#16392c;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#063b2d;color:white;padding:calc(env(safe-area-inset-top) + 18px) 18px 19px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}main{max-width:650px;margin:auto;padding:16px 16px 100px}h2{font-size:19px;margin:8px 0 16px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 13px #123b2610}.hero{background:linear-gradient(135deg,#004f30,#00733d);color:white}.muted{color:#788a80;font-size:13px}.hero .muted{color:#c9ebd5}.number{font-size:28px;font-weight:750;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.value{font-size:18px;font-weight:750;overflow-wrap:anywhere}.green{color:#008447}.red{color:#bd3946}.pill{border-radius:25px;background:#e7f7ed;padding:5px 9px;color:#008447;font-size:12px}.btn{border:0;border-radius:13px;background:#00723e;color:white;padding:13px 17px;font-weight:700;font-size:15px;cursor:pointer}.btn.secondary{background:#e8f0eb;color:#164632}.btn.danger{background:#fbe7e8;color:#9a2631}.full{width:100%}input,select,textarea{display:block;width:100%;padding:13px;border:1px solid #d9e5de;border-radius:12px;background:white;font:inherit;margin:6px 0 14px}label{font-weight:600;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 3px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e2eae5}nav button{border:0;background:none;color:#677d70;font-size:11px;display:grid;gap:5px;justify-items:center}nav button.active{color:#007a41;font-weight:750}nav span{font-size:22px}.item{border-bottom:1px solid #edf1ee;padding:13px 0}.item:last-child{border:0}.smallbtn{border:0;background:none;color:#00763d;font-weight:700;padding:6px}.hidden{display:none!important}.center{text-align:center}.empty{padding:28px 10px;text-align:center;color:#82948a}.tag{font-size:12px;color:#6d8275}#auth{max-width:460px;margin:12vh auto;padding:20px}#auth h1{font-size:32px}.tab{display:flex;gap:8px;overflow:auto;margin:10px 0}.tab button{white-space:nowrap}input[type=date]{min-height:48px}</style></head><body><div id="auth" class="hidden"><div class="card"><div class="center" style="font-size:46px">🗓️</div><h1 class="center">BUGÜNÜM</h1><p class="muted center">Ödeme • Borç • Plan • Takip</p><h2 id="authTitle">PIN oluştur</h2><label>6 haneli PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"><button class="btn full" onclick="unlock()">Devam et</button><p class="muted" id="authMessage">PIN unutulursa kurtarma sistemi yoktur. Düzenli yedek alın.</p></div></div><div id="app" class="hidden"><header><h1>🗓️ BUGÜNÜM</h1><button class="smallbtn" style="color:white" onclick="lock()">🔒 Kilitle</button></header><main id="view"></main><nav id="nav"></nav></div><script>
const KEY='bugunum-data-v1',PINKEY='bugunum-pin-v1';let data={debts:[],payments:[],transactions:[]},page='home',month=new Date().toISOString().slice(0,7);const money=n=>(Number(n)||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('sv-SE'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function load(){try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){alert('Kayıtlar okunamadı. Yedeğinizi kontrol edin.')}data.debts||=[];data.payments||=[];data.transactions||=[]}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Kayıt yapılamadı. Cihaz saklama alanını kontrol edin.')}}function sum(a){return a.reduce((s,x)=>s+Number(x||0),0)}function paid(id){return sum(data.payments.filter(p=>p.debtId===id).map(p=>p.amount))}function left(d){return Math.max(0,Number(d.amount)-paid(d.id))}function totalLeft(){return sum(data.debts.map(left))}function monthly(d){return Number(d.monthly)||0}function monthPaid(id){return sum(data.payments.filter(p=>p.debtId===id&&p.date.slice(0,7)===month).map(p=>p.amount))}function show(p){page=p;render()}function lock(){document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');document.getElementById('pin').value='';document.getElementById('authTitle').textContent=localStorage.getItem(PINKEY)?'PIN ile giriş':'PIN oluştur'}async function hash(s){let b=new TextEncoder().encode(s);let h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function unlock(){let v=document.getElementById('pin').value;if(!/^\d{6}$/.test(v)){alert('6 rakamlı PIN girin');return}try{let h=await hash(v),old=localStorage.getItem(PINKEY);if(old&&old!==h){alert('PIN yanlış');return}if(!old)localStorage.setItem(PINKEY,h);document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){alert('Bu ortam güvenli kayıtları desteklemiyor. Uygulamayı HTTPS üzerinden Safari ana ekranına kurarak açın.')}}function nav(){let n=[['home','⌂','Ana Sayfa'],['debts','▤','Borçlarım'],['plan','▦','Plan'],['history','◷','Geçmiş'],['more','☷','Diğer']];document.getElementById('nav').innerHTML=n.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="show('${id}')"><span>${icon}</span>${label}</button>`).join('')}function rowDebt(d){return `<div class="item"><div class="row"><b>${esc(d.name)}</b><span class="pill">${esc(d.type)}</span></div><p class="muted">Başlangıç ${money(d.amount)} · Ödenen ${money(paid(d.id))}</p><div class="row"><b>Kalan: ${money(left(d))}</b><button class="smallbtn" onclick="paymentForm('${d.id}')">+ Ödeme</button></div><div class="row"><span class="tag">Aylık plan: ${money(monthly(d))}</span><button class="smallbtn" onclick="editDebt('${d.id}')">Düzenle</button></div></div>`}function render(){nav();let v=document.getElementById('view'),mPaid=sum(data.payments.filter(p=>p.date.slice(0,7)===month).map(p=>p.amount)),mIn=sum(data.transactions.filter(t=>t.date.slice(0,7)===month&&t.type==='Gelir').map(t=>t.amount)),mOut=sum(data.transactions.filter(t=>t.date.slice(0,7)===month&&t.type==='Gider').map(t=>t.amount));let picker=`<label>Ay seç</label><input type="month" value="${month}" onchange="month=this.value;render()">`;if(page==='home')v.innerHTML=`${picker}<div class="card hero"><div class="muted">TOPLAM KALAN BORÇ</div><div class="number">${money(totalLeft())}</div><div class="row"><span>Toplam borç ${money(sum(data.debts.map(d=>d.amount)))}</span><span>Ödenen ${money(sum(data.payments.map(p=>p.amount)))}</span></div></div><div class="grid"><div class="card"><div class="muted">Bu ay planlanan</div><div class="value">${money(sum(data.debts.filter(d=>left(d)>0||monthPaid(d.id)>0).map(monthly)))}</div></div><div class="card"><div class="muted">Bu ay ödenen</div><div class="value green">${money(mPaid)}</div></div><div class="card"><div class="muted">Gelir</div><div class="value green">${money(mIn)}</div></div><div class="card"><div class="muted">Gider</div><div class="value red">${money(mOut)}</div></div></div><div class="card"><h2>Borçlarım</h2>${data.debts.length?data.debts.map(rowDebt).join(''):'<div class="empty">Henüz borç eklenmedi.</div>'}<button class="btn full" onclick="debtForm()">+ Yeni Borç Ekle</button></div>`;else if(page==='debts')v.innerHTML=`<div class="row"><h2>Borçlarım</h2><button class="btn" onclick="debtForm()">+ Yeni Borç</button></div><div class="card hero"><div class="muted">Toplam kalan</div><div class="number">${money(totalLeft())}</div></div><div class="card">${data.debts.length?data.debts.map(rowDebt).join(''):'<div class="empty">Borç listesi boş.</div>'}</div>`;else if(page==='plan')v.innerHTML=`<h2>Aylık Ödeme Planı</h2>${picker}<div class="card hero"><div class="muted">Bu ay planlanan</div><div class="number">${money(sum(data.debts.filter(d=>left(d)>0||monthPaid(d.id)>0).map(monthly)))}</div><div>Bu ay ödenen: ${money(mPaid)}</div></div><div class="card">${data.debts.length?data.debts.map(d=>`<div class="item"><div class="row"><b>${esc(d.name)}</b><b>${money(monthly(d))}</b></div><p class="muted">Ödeme günü: ${esc(d.day||'Belirtilmedi')} · Bu ay ödenen: ${money(monthPaid(d.id))}</p><button class="smallbtn" onclick="paymentForm('${d.id}')">Ödeme kaydet</button></div>`).join(''):'<div class="empty">Ödeme planı henüz boş.</div>'}</div>`;else if(page==='history')v.innerHTML=`<h2>Ödeme Geçmişi</h2>${picker}<div class="card">${data.payments.filter(p=>p.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{let d=data.debts.find(d=>d.id===p.debtId);return `<div class="item"><div class="row"><b>${esc(d?.name||'Silinmiş borç')}</b><b class="green">${money(p.amount)}</b></div><p class="muted">${esc(p.date)} · ${esc(p.note||'Ödeme')}</p><button class="smallbtn" onclick="editPayment('${p.id}')">Düzenle</button></div>`}).join('')||'<div class="empty">Bu ay ödeme kaydı yok.</div>'}</div><button class="btn full" onclick="paymentForm()">+ Ödeme Ekle</button>`;else if(page==='more')v.innerHTML=`<h2>Gelir / Gider ve Ayarlar</h2>${picker}<div class="grid"><div class="card"><div class="muted">Gelir</div><div class="value green">${money(mIn)}</div></div><div class="card"><div class="muted">Gider</div><div class="value red">${money(mOut)}</div></div></div><button class="btn full" onclick="transactionForm()">+ Gelir / Gider Ekle</button><div class="card">${data.transactions.filter(t=>t.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.date)} · ${esc(t.type)}</div></div><div><b class="${t.type==='Gelir'?'green':'red'}">${money(t.amount)}</b><br><button class="smallbtn" onclick="editTransaction('${t.id}')">Düzenle</button></div></div>`).join('')||'<div class="empty">İşlem yok.</div>'}</div><div class="card"><h2>Yedekleme</h2><p class="muted">Veriler bu cihazın tarayıcı saklama alanındadır. Düzenli yedek indirin.</p><button class="btn secondary" onclick="backup()">Yedek indir</button><label style="display:block;margin-top:15px">Yedekten geri yükle</label><input type="file" accept="application/json" onchange="restore(this)"></div>`;else if(page==='form'){} }
function form(title,body,submit){page='form';document.getElementById('nav').innerHTML='';document.getElementById('view').innerHTML=`<button class="smallbtn" onclick="show('home')">← Geri</button><div class="card"><h2>${title}</h2><form id="entry">${body}<button class="btn full" type="submit">Kaydet</button></form></div>`;document.getElementById('entry').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target))}}function debtForm(id){let d=data.debts.find(x=>x.id===id);form(d?'Borcu düzenle':'Yeni borç',`<label>Kişi / banka adı</label><input name="name" required value="${esc(d?.name||'')}"><label>Tür</label><select name="type"><option ${d?.type==='Banka'?'selected':''}>Banka</option><option ${d?.type==='Kişi'?'selected':''}>Kişi</option><option ${d?.type==='Diğer'?'selected':''}>Diğer</option></select><label>Başlangıç borcu (TL)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${d?.amount||''}"><label>Aylık planlanan ödeme (TL)</label><input name="monthly" type="number" min="0" step="0.01" value="${d?.monthly||0}"><label>Ödeme günü (1-31)</label><input name="day" type="number" min="1" max="31" value="${d?.day||''}">${d?'<button type="button" class="btn danger full" onclick="deleteDebt(\''+d.id+'\')">Borcu sil</button>':''}`,f=>{let item={id:d?.id||uid(),name:f.get('name').trim(),type:f.get('type'),amount:+f.get('amount'),monthly:+f.get('monthly'),day:f.get('day')};if(d)Object.assign(d,item);else data.debts.push(item);save();show('debts')})}function deleteDebt(id){if(!confirm('Borç ve bağlı ödeme geçmişi silinsin mi?'))return;data.debts=data.debts.filter(d=>d.id!==id);data.payments=data.payments.filter(p=>p.debtId!==id);save();show('debts')}function paymentForm(id,pid){let p=data.payments.find(x=>x.id===pid);if(!data.debts.length){alert('Önce borç ekleyin');return}form(p?'Ödemeyi düzenle':'Ödeme ekle',`<label>Kime / hangi borca?</label><select name="debtId">${data.debts.map(d=>`<option value="${d.id}" ${d.id===(p?.debtId||id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select><label>Ödeme tarihi</label><input name="date" type="date" required value="${p?.date||today()}"><label>Ödeme tutarı (TL)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${p?.amount||''}"><label>Açıklama</label><input name="note" value="${esc(p?.note||'')}">${p?'<button type="button" class="btn danger full" onclick="deletePayment(\''+p.id+'\')">Ödemeyi sil</button>':''}`,f=>{let debt=data.debts.find(d=>d.id===f.get('debtId')),other=sum(data.payments.filter(x=>x.debtId===debt.id&&x.id!==p?.id).map(x=>x.amount)),a=+f.get('amount');if(a>debt.amount-other){alert('Ödeme kalan borçtan büyük olamaz');return}let item={id:p?.id||uid(),debtId:debt.id,date:f.get('date'),amount:a,note:f.get('note')};if(p)Object.assign(p,item);else data.payments.push(item);save();month=item.date.slice(0,7);show('history')})}function editPayment(id){paymentForm(null,id)}function deletePayment(id){if(!confirm('Ödeme silinsin mi?'))return;data.payments=data.payments.filter(p=>p.id!==id);save();show('history')}function transactionForm(id){let t=data.transactions.find(x=>x.id===id);form(t?'İşlemi düzenle':'Gelir / Gider Ekle',`<label>İşlem türü</label><select name="type"><option ${t?.type==='Gider'?'selected':''}>Gider</option><option ${t?.type==='Gelir'?'selected':''}>Gelir</option></select><label>Açıklama</label><input name="name" required value="${esc(t?.name||'')}"><label>Tutar (TL)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${t?.amount||''}"><label>Tarih</label><input name="date" type="date" required value="${t?.date||today()}">${t?'<button type="button" class="btn danger full" onclick="deleteTransaction(\''+t.id+'\')">İşlemi sil</button>':''}`,f=>{let item={id:t?.id||uid(),type:f.get('type'),name:f.get('name'),amount:+f.get('amount'),date:f.get('date')};if(t)Object.assign(t,item);else data.transactions.push(item);save();month=item.date.slice(0,7);show('more')})}function editTransaction(id){transactionForm(id)}function deleteTransaction(id){if(!confirm('İşlem silinsin mi?'))return;data.transactions=data.transactions.filter(t=>t.id!==id);save();show('more')}function backup(){let blob=new Blob([JSON.stringify({version:1,data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bugunum-yedek-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function restore(el){let file=el.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.data||!Array.isArray(obj.data.debts)||!Array.isArray(obj.data.payments)||!Array.isArray(obj.data.transactions))throw Error();if(!confirm('Mevcut kayıtların üzerine yedek yüklensin mi?'))return;data=obj.data;save();show('home')}catch(e){alert('Geçersiz yedek dosyası')}}load();lock();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
